<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LanPM - 局域网项目管理系统</title>
  <style>
    :root {
      --blue: #007AFF;
      --blue-light: #E5F1FF;
      --green: #34C759;
      --green-light: #E5F9ED;
      --orange: #FF9500;
      --orange-light: #FFF4E5;
      --red: #FF3B30;
      --red-light: #FFE5E3;
      --purple: #AF52DE;
      --purple-light: #F5E5FF;
      --gray: #8E8E93;
      --gray-light: #F2F2F7;
      --gray-dark: #48484A;
      --bg: #F5F5F7;
      --card: #FFFFFF;
      --text: #1D1D1F;
      --text-secondary: #86868B;
      --border: #D1D1D6;
      --shadow: 0 4px 24px rgba(0,0,0,0.08);
      --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
      --radius: 12px;
      --radius-lg: 20px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Layout */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Top Bar */
    .topbar {
      height: 52px;
      background: rgba(255,255,255,0.72);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 16px;
      z-index: 100;
    }

    .logo {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 14px;
      font-weight: 700;
    }

    .nav-tabs {
      display: flex;
      gap: 4px;
      flex: 1;
    }

    .nav-tab {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 500;
      transition: all 0.2s;
    }

    .nav-tab:hover { background: rgba(0,0,0,0.04); }
    .nav-tab.active { background: var(--blue-light); color: var(--blue); }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px 6px 6px;
      background: var(--gray-light);
      border-radius: 24px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .user-pill:hover { background: rgba(0,0,0,0.08); }

    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
      font-weight: 600;
    }

    .user-info {
      display: flex;
      flex-direction: column;
    }

    .user-name { font-size: 13px; font-weight: 600; }
    .user-role { font-size: 11px; color: var(--text-secondary); }

    .role-badge {
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }

    .role-super { background: linear-gradient(135deg, #FFD700, #FFA500); color: white; }
    .role-leader { background: var(--purple-light); color: var(--purple); }
    .role-admin { background: var(--blue-light); color: var(--blue); }
    .role-member { background: var(--gray-light); color: var(--gray-dark); }

    /* Main Content */
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      background: rgba(255,255,255,0.6);
      backdrop-filter: saturate(180%) blur(20px);
      border-right: 1px solid rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-section {
      padding: 16px;
    }

    .sidebar-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .member-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .member-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .member-item:hover { background: rgba(0,0,0,0.04); }

    .member-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 14px;
      font-weight: 600;
      position: relative;
    }

    .member-avatar .online-dot {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 10px;
      height: 10px;
      background: var(--green);
      border: 2px solid white;
      border-radius: 50%;
    }

    .member-name { font-size: 14px; font-weight: 500; }
    .member-dept { font-size: 12px; color: var(--text-secondary); }

    /* Chat Area */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: white;
    }

    .chat-header {
      padding: 16px 24px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .project-title { font-size: 18px; font-weight: 600; }
    .project-meta { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .message {
      display: flex;
      gap: 12px;
      max-width: 70%;
    }

    .message.own { align-self: flex-end; flex-direction: row-reverse; }

    .message-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 15px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .message-content { display: flex; flex-direction: column; gap: 6px; }

    .message-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .message-name { font-size: 14px; font-weight: 600; }
    .message-time { font-size: 12px; color: var(--text-secondary); }

    .message-bubble {
      padding: 14px 18px;
      border-radius: 18px;
      background: var(--gray-light);
      font-size: 15px;
      line-height: 1.5;
    }

    .message.own .message-bubble {
      background: var(--blue);
      color: white;
    }

    /* System Message */
    .system-msg {
      text-align: center;
      padding: 10px 20px;
    }

    .system-msg span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--gray-light);
      border-radius: 20px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .system-icon { font-size: 14px; }

    /* Task Card in Chat */
    .task-card-msg {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 300px;
      box-shadow: var(--shadow);
    }

    .task-card-msg:hover {
      border-color: var(--blue);
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .task-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .task-card-icon { font-size: 20px; }
    .task-card-title { font-weight: 600; font-size: 15px; flex: 1; }

    .task-card-status {
      padding: 5px 12px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-todo { background: var(--gray-light); color: var(--gray-dark); }
    .status-doing { background: var(--orange-light); color: var(--orange); }
    .status-done { background: var(--green-light); color: var(--green); }

    .task-card-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .task-card-meta span {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .mention {
      color: var(--blue);
      font-weight: 500;
      cursor: pointer;
      padding: 0 2px;
      border-radius: 4px;
      background: var(--blue-light);
    }

    /* Chat Input */
    .chat-input-area {
      padding: 16px 24px 24px;
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    .input-wrapper {
      flex: 1;
      position: relative;
      background: var(--gray-light);
      border-radius: 24px;
      padding: 4px;
    }

    .chat-input {
      width: 100%;
      padding: 14px 20px;
      border: none;
      background: transparent;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      resize: none;
    }

    .input-actions {
      display: flex;
      gap: 8px;
    }

    .input-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: var(--gray-light);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      color: var(--gray);
    }

    .input-btn:hover { background: rgba(0,0,0,0.08); }
    .input-btn.send {
      background: var(--blue);
      color: white;
    }
    .input-btn.send:hover { background: #0066d6; }

    /* Right Panel - Kanban Mini */
    .right-panel {
      width: 280px;
      background: rgba(255,255,255,0.6);
      backdrop-filter: saturate(180%) blur(20px);
      border-left: 1px solid rgba(0,0,0,0.06);
      padding: 20px;
      overflow-y: auto;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .panel-title { font-size: 16px; font-weight: 600; }

    .stats-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .stat-item {
      flex: 1;
      padding: 14px 10px;
      background: white;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .stat-num { font-size: 22px; font-weight: 700; }
    .stat-label { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

    .stat-todo .stat-num { color: var(--gray-dark); }
    .stat-doing .stat-num { color: var(--orange); }
    .stat-done .stat-num { color: var(--green); }

    .mini-kanban {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .mini-col {
      background: white;
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .mini-col-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .mini-col-title { font-size: 13px; font-weight: 600; }
    .mini-col-count {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--gray-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--gray-dark);
    }

    .mini-task {
      padding: 12px;
      background: var(--gray-light);
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mini-task:last-child { margin-bottom: 0; }
    .mini-task:hover { background: rgba(0,0,0,0.06); }
    .mini-task-title { font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    .mini-task-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .mini-avatar {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--blue);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 600;
    }

    /* Bottom Navigation */
    .bottom-nav {
      height: 64px;
      background: rgba(255,255,255,0.8);
      backdrop-filter: saturate(180%) blur(20px);
      border-top: 1px solid rgba(0,0,0,0.06);
      display: flex;
      padding: 0 40px;
    }

    .view-tabs {
      display: flex;
      flex: 1;
      justify-content: center;
      gap: 8px;
    }

    .view-tab {
      flex: 1;
      max-width: 160px;
      padding: 16px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 12px;
      transition: all 0.2s;
    }

    .view-tab:hover { background: rgba(0,0,0,0.04); }
    .view-tab.active {
      background: var(--blue-light);
      color: var(--blue);
    }

    .view-tab svg { width: 20px; height: 20px; }

    /* Detail Panel */
    .detail-panel {
      position: fixed;
      bottom: 64px;
      left: 0;
      right: 0;
      height: 0;
      background: white;
      overflow: hidden;
      transition: height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 -8px 32px rgba(0,0,0,0.08);
    }

    .detail-panel.open { height: 320px; }

    .detail-content {
      height: 100%;
      padding: 24px 40px;
      overflow-y: auto;
    }

    .detail-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .detail-title { font-size: 20px; font-weight: 700; }

    /* Buttons */
    .btn {
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary { background: var(--blue); color: white; }
    .btn-primary:hover { background: #0066d6; }
    .btn-secondary { background: var(--gray-light); color: var(--text); }
    .btn-secondary:hover { background: rgba(0,0,0,0.08); }

    .btn-icon {
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Kanban Full View */
    .kanban-full {
      display: flex;
      gap: 20px;
      height: calc(100% - 60px);
    }

    .kanban-col {
      flex: 1;
      background: var(--gray-light);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .kanban-col-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .kanban-col-count {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
    }

    .kanban-tasks {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .kanban-task {
      background: white;
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .kanban-task:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .kanban-task-title { font-weight: 600; font-size: 14px; margin-bottom: 10px; }

    .kanban-task-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* TODO List */
    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      height: calc(100% - 60px);
      overflow-y: auto;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      background: var(--gray-light);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .todo-item:hover { background: rgba(0,0,0,0.06); }

    .todo-check {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      border: 2px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .todo-check.done {
      background: var(--green);
      border-color: var(--green);
      color: white;
    }

    .todo-content { flex: 1; }
    .todo-title { font-size: 15px; font-weight: 500; }
    .todo-title.done { text-decoration: line-through; color: var(--text-secondary); }
    .todo-meta { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }

    .priority-badge {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
    }

    .priority-high { background: var(--red-light); color: var(--red); }
    .priority-medium { background: var(--orange-light); color: var(--orange); }
    .priority-low { background: var(--green-light); color: var(--green); }

    /* Task Tree */
    .task-tree {
      display: flex;
      flex-direction: column;
      gap: 8px;
      height: calc(100% - 60px);
      overflow-y: auto;
    }

    .tree-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: var(--gray-light);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tree-item:hover { background: rgba(0,0,0,0.06); }

    .tree-expand {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .tree-expand:hover { background: rgba(0,0,0,0.06); }

    .tree-content { flex: 1; }
    .tree-title { font-size: 14px; font-weight: 500; }
    .tree-meta { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

    .progress-bar {
      width: 100px;
      height: 6px;
      background: rgba(0,0,0,0.08);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--blue);
      border-radius: 3px;
      transition: width 0.3s;
    }

    /* Gantt Chart */
    .gantt-container {
      display: flex;
      gap: 20px;
      height: calc(100% - 60px);
    }

    .gantt-labels {
      width: 180px;
      flex-shrink: 0;
    }

    .gantt-label {
      height: 44px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 13px;
      border-bottom: 1px solid rgba(0,0,0,0.04);
    }

    .gantt-label.header {
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 11px;
    }

    .gantt-timeline {
      flex: 1;
      overflow-x: auto;
    }

    .gantt-header {
      display: flex;
      margin-bottom: 8px;
    }

    .gantt-day {
      width: 56px;
      flex-shrink: 0;
      text-align: center;
      font-size: 11px;
      color: var(--text-secondary);
      padding: 8px 0;
    }

    .gantt-day.weekend { background: rgba(0,0,0,0.02); }

    .gantt-rows { position: relative; }

    .gantt-row {
      display: flex;
      position: relative;
      height: 44px;
      align-items: center;
    }

    .gantt-cell {
      width: 56px;
      flex-shrink: 0;
      height: 100%;
      border-right: 1px solid rgba(0,0,0,0.04);
    }

    .gantt-cell.weekend { background: rgba(0,0,0,0.02); }

    .gantt-bar {
      position: absolute;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 12px;
      font-weight: 500;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .gantt-bar:hover { opacity: 0.9; transform: scale(1.02); }
    .gantt-bar.todo { background: var(--blue); }
    .gantt-bar.doing { background: var(--orange); }
    .gantt-bar.done { background: var(--green); }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }

    .modal-overlay.show { opacity: 1; visibility: visible; }

    .modal {
      background: white;
      border-radius: var(--radius-lg);
      width: 480px;
      max-height: 85vh;
      overflow: hidden;
      transform: scale(0.95) translateY(20px);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--shadow-lg);
    }

    .modal-overlay.show .modal {
      transform: scale(1) translateY(0);
    }

    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title { font-size: 18px; font-weight: 700; }

    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--gray-light);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .close-btn:hover { background: rgba(0,0,0,0.1); }

    .modal-body { padding: 24px; overflow-y: auto; max-height: 60vh; }

    .form-group { margin-bottom: 20px; }
    .form-group:last-child { margin-bottom: 0; }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .form-input, .form-select {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      background: white;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus, .form-select:focus { border-color: var(--blue); }

    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid rgba(0,0,0,0.06);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* Leader Dashboard */
    .leader-view {
      flex: 1;
      overflow-y: auto;
      padding: 32px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: white;
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .stat-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .stat-card-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .stat-card-icon.blue { background: var(--blue-light); }
    .stat-card-icon.green { background: var(--green-light); }
    .stat-card-icon.orange { background: var(--orange-light); }
    .stat-card-icon.red { background: var(--red-light); }

    .stat-card-title { font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
    .stat-card-value { font-size: 32px; font-weight: 700; }

    .progress-ring {
      width: 80px;
      height: 80px;
      position: relative;
    }

    .progress-ring svg {
      transform: rotate(-90deg);
    }

    .progress-ring circle {
      fill: none;
      stroke-width: 8;
      stroke-linecap: round;
    }

    .progress-ring .bg { stroke: var(--gray-light); }
    .progress-ring .fg { stroke: var(--blue); transition: stroke-dashoffset 0.5s; }

    .progress-ring .value {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
    }

    /* Table */
    .data-table {
      width: 100%;
      background: white;
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .data-table table {
      width: 100%;
      border-collapse: collapse;
    }

    .data-table th, .data-table td {
      padding: 14px 16px;
      text-align: left;
    }

    .data-table th {
      background: var(--gray-light);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .data-table td {
      font-size: 14px;
      border-bottom: 1px solid rgba(0,0,0,0.04);
    }

    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: rgba(0,0,0,0.02); }

    /* Org Chart */
    .org-chart {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 24px;
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
    }

    .org-level {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .org-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 16px 24px;
      background: var(--gray-light);
      border-radius: 14px;
      min-width: 140px;
    }

    .org-node.super {
      background: linear-gradient(135deg, #FFD700, #FFA500);
      color: white;
    }

    .org-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
    }

    .org-node.super .org-avatar { background: rgba(255,255,255,0.3); }

    .org-name { font-weight: 600; font-size: 14px; }
    .org-role { font-size: 12px; opacity: 0.8; }

    /* Audit Log */
    .audit-log {
      background: white;
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .audit-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid rgba(0,0,0,0.04);
    }

    .audit-item:last-child { border-bottom: none; }

    .audit-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--blue-light);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .audit-content { flex: 1; }
    .audit-text { font-size: 14px; line-height: 1.5; }
    .audit-time { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

    /* Navbar for Leader */
    .leader-nav {
      display: flex;
      gap: 4px;
      background: var(--gray-light);
      padding: 4px;
      border-radius: 12px;
    }

    .leader-nav-item {
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      transition: all 0.2s;
    }

    .leader-nav-item:hover { color: var(--text); }
    .leader-nav-item.active {
      background: white;
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    /* Create Button */
    .create-btn {
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      background: var(--blue);
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .create-btn:hover { background: #0066d6; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.25); }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-in { animation: fadeIn 0.3s ease forwards; }

    /* View containers */
    .view-container {
      display: none;
      flex: 1;
      overflow: hidden;
    }

    .view-container.active { display: flex; }
  </style>
</head>

    // ========== Initialize ==========
    function init() {
      updateUserInfo();
      updateRoleBasedUI();
      renderMembers();
      renderChat();
      renderKanban();
      updateStats();
      renderLeaderDashboard();
      setupInputHandlers();
    }

    // ========== User & Role ==========
    function updateUserInfo() {
      const user = data.currentUser;
      document.getElementById('currentUserAvatar').textContent = user.name[0];
      document.getElementById('currentUserName').textContent = user.name;

      const roleLabels = {
        'super_leader': '超级领导',
        'leader': '普通领导',
        'admin': '项目管理员',
        'member': '普通成员'
      };

      const roleBadge = document.getElementById('roleBadge');
      roleBadge.textContent = roleLabels[user.role];
      roleBadge.className = 'role-badge role-' + (user.role === 'super_leader' ? 'super' : user.role === 'leader' ? 'leader' : user.role === 'admin' ? 'admin' : 'member');
      document.getElementById('currentUserRole').textContent = user.department + ' · ' + user.title;
    }

    function updateRoleBasedUI() {
      const role = data.currentUser.role;
      const leaderTab = document.getElementById('leaderTab');
      leaderTab.style.display = (role === 'super_leader' || role === 'leader') ? 'block' : 'none';
    }

    // ========== Navigation ==========
    function switchMainView(view) {
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`.nav-tab[data-view="${view}"]`).classList.add('active');

      document.getElementById('projectView').classList.toggle('active', view === 'project');
      document.getElementById('leaderView').classList.toggle('active', view === 'leader');

      if (view === 'leader') {
        renderLeaderDashboard();
      }
    }

    function switchLeaderTab(tab) {
      data.currentLeaderTab = tab;
      document.querySelectorAll('.leader-nav-item').forEach(t => t.classList.remove('active'));
      document.querySelector(`.leader-nav-item:nth-child(${
        tab === 'dashboard' ? 1 : tab === 'projects' ? 2 : tab === 'org' ? 3 : tab === 'audit' ? 4 : 5
      })`).classList.add('active');
      renderLeaderDashboard();
    }

    function switchView(view) {
      data.currentView = view;
      document.querySelectorAll('.view-tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));

      const panel = document.getElementById('detailPanel');
      const content = document.getElementById('detailContent');

      if (view === 'kanban') {
        panel.classList.remove('open');
      } else {
        panel.classList.add('open');
        renderDetailView(view);
      }
    }

    // ========== Render Functions ==========
    function renderMembers() {
      const container = document.getElementById('memberList');
      const project = data.projects[data.currentProject];
      container.innerHTML = '';

      project.members.forEach(m => {
        const roleLabels = { 'super_leader': '👑', 'leader': '👔', 'admin': '📋', 'member': '' };
        container.innerHTML += `
          <div class="member-item fade-in">
            <div class="member-avatar">
              ${m.name[0]}
              ${m.online ? '<div class="online-dot"></div>' : ''}
            </div>
            <div>
              <div class="member-name">${m.name} ${roleLabels[m.role]}</div>
              <div class="member-dept">${m.department} · ${m.title}</div>
            </div>
          </div>
        `;
      });

      updateAssigneeDropdowns();
    }

    function renderChat() {
      const container = document.getElementById('chatMessages');
      const project = data.projects[data.currentProject];
      container.innerHTML = '';

      project.messages.forEach(msg => {
        if (msg.type === 'system') {
          container.innerHTML += `
            <div class="system-msg fade-in">
              <span>${msg.text}</span>
            </div>
          `;
        } else if (msg.type === 'task_card') {
          const task = project.tasks.find(t => t.id === msg.taskId);
          if (task) {
            const statusLabels = { todo: '待办', doing: '进行中', done: '已完成' };
            container.innerHTML += `
              <div class="message fade-in">
                <div class="message-avatar">${msg.avatar}</div>
                <div class="message-content">
                  <div class="message-header">
                    <span class="message-name">${msg.sender}</span>
                    <span class="message-time">${msg.time}</span>
                  </div>
                  <div class="task-card-msg" onclick="openTaskDetail('${task.id}')">
                    <div class="task-card-header">
                      <span class="task-card-icon">📋</span>
                      <span class="task-card-title">${task.title}</span>
                      <span class="task-card-status status-${task.status}">${statusLabels[task.status]}</span>
                    </div>
                    <div class="task-card-meta">
                      <span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                          <circle cx="12" cy="7" r="4"/>
                        </svg>
                        ${task.assignee || '未指派'}
                      </span>
                      <span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                          <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
                        </svg>
                        ${task.dueDate}
                      </span>
                    </div>
                  </div>
                </div>
              </div>
            `;
          }
        } else {
          container.innerHTML += `
            <div class="message fade-in ${msg.sender === data.currentUser.name ? 'own' : ''}">
              <div class="message-avatar">${msg.avatar}</div>
              <div class="message-content">
                <div class="message-header">
                  <span class="message-name">${msg.sender}</span>
                  <span class="message-time">${msg.time}</span>
                </div>
                <div class="message-bubble">${formatContent(msg.content)}</div>
              </div>
            </div>
          `;
        }
      });

      container.scrollTop = container.scrollHeight;
    }

    function formatContent(content) {
      return content
        .replace(/@(\w+)/g, '<span class="mention">@$1</span>')
        .replace(/@create\s+(.+)/g, '<span style="color:var(--green);font-weight:600;">@create</span> $1');
    }

    function renderKanban() {
      const container = document.getElementById('kanbanColumns');
      const project = data.projects[data.currentProject];
      const tasks = project.tasks;

      const columns = [
        { key: 'todo', title: '待办', tasks: tasks.filter(t => t.status === 'todo') },
        { key: 'doing', title: '进行中', tasks: tasks.filter(t => t.status === 'doing') },
        { key: 'done', title: '已完成', tasks: tasks.filter(t => t.status === 'done') }
      ];

      container.innerHTML = columns.map(col => `
        <div class="mini-col fade-in">
          <div class="mini-col-header">
            <span class="mini-col-title">${col.title}</span>
            <span class="mini-col-count">${col.tasks.length}</span>
          </div>
          ${col.tasks.map(task => `
            <div class="mini-task" onclick="openTaskDetail('${task.id}')">
              <div class="mini-task-title">${task.title}</div>
              <div class="mini-task-meta">
                <div style="display:flex;align-items:center;gap:4px;">
                  ${task.assignee ? `<div class="mini-avatar">${task.assignee[0]}</div>${task.assignee}` : '未指派'}
                </div>
                ${task.dueDate ? task.dueDate.slice(5) : ''}
              </div>
            </div>
          `).join('')}
        </div>
      `).join('');
    }

    function updateStats() {
      const project = data.projects[data.currentProject];
      const tasks = project.tasks;
      document.getElementById('statTodo').textContent = tasks.filter(t => t.status === 'todo').length;
      document.getElementById('statDoing').textContent = tasks.filter(t => t.status === 'doing').length;
      document.getElementById('statDone').textContent = tasks.filter(t => t.status === 'done').length;
    }

    function updateAssigneeDropdowns() {
      const project = data.projects[data.currentProject];
      const members = project.members;

      ['taskAssignee', 'newTaskAssignee'].forEach(id => {
        const select = document.getElementById(id);
        if (select) {
          select.innerHTML = '<option value="">未指派</option>';
          members.forEach(m => {
            select.innerHTML += `<option value="${m.name}">${m.name} - ${m.title}</option>`;
          });
        }
      });
    }

    // ========== Detail Views ==========
    function renderDetailView(view) {
      const content = document.getElementById('detailContent');
      const project = data.projects[data.currentProject];
      const tasks = project.tasks;

      switch(view) {
        case 'kanban':
          content.innerHTML = renderKanbanFull(tasks);
          break;
        case 'todo':
          content.innerHTML = renderTodoList(tasks);
          break;
        case 'tree':
          content.innerHTML = renderTaskTree(tasks);
          break;
        case 'gantt':
          content.innerHTML = renderGantt(tasks);
          break;
      }
    }

    function renderKanbanFull(tasks) {
      const columns = [
        { key: 'todo', title: '待办', tasks: tasks.filter(t => t.status === 'todo'), color: 'var(--gray-dark)' },
        { key: 'doing', title: '进行中', tasks: tasks.filter(t => t.status === 'doing'), color: 'var(--orange)' },
        { key: 'done', title: '已完成', tasks: tasks.filter(t => t.status === 'done'), color: 'var(--green)' }
      ];

      return `
        <div class="detail-header">
          <span class="detail-title">任务看板</span>
          <button class="create-btn" onclick="showCreateTaskModal()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            新建任务
          </button>
        </div>
        <div class="kanban-full">
          ${columns.map(col => `
            <div class="kanban-col">
              <div class="kanban-col-title">
                ${col.title}
                <span class="kanban-col-count">${col.tasks.length}</span>
              </div>
              <div class="kanban-tasks">
                ${col.tasks.map(task => `
                  <div class="kanban-task" onclick="openTaskDetail('${task.id}')">
                    <div class="kanban-task-title">${task.title}</div>
                    <div class="kanban-task-info">
                      <span>${task.assignee || '未指派'}</span>
                      <span>${task.dueDate || '无截止日期'}</span>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderTodoList(tasks) {
      return `
        <div class="detail-header">
          <span class="detail-title">待办事项</span>
          <button class="create-btn" onclick="showCreateTaskModal()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            新建任务
          </button>
        </div>
        <div class="todo-list">
          ${tasks.map(task => `
            <div class="todo-item" onclick="openTaskDetail('${task.id}')">
              <div class="todo-check ${task.status === 'done' ? 'done' : ''}" onclick="event.stopPropagation();toggleTaskStatus('${task.id}')">
                ${task.status === 'done' ? '✓' : ''}
              </div>
              <div class="todo-content">
                <div class="todo-title ${task.status === 'done' ? 'done' : ''}">${task.title}</div>
                <div class="todo-meta">${task.assignee || '未指派'} · ${task.dueDate || '无截止日期'}</div>
              </div>
              <span class="priority-badge priority-${task.priority}">
                ${task.priority === 'high' ? '高' : task.priority === 'medium' ? '中' : '低'}
              </span>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderTaskTree(tasks) {
      const parents = tasks.slice(0, 6);
      return `
        <div class="detail-header">
          <span class="detail-title">任务树</span>
        </div>
        <div class="task-tree">
          ${parents.map(task => `
            <div class="tree-item" onclick="openTaskDetail('${task.id}')">
              <div class="tree-expand">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="9 18 15 12 9 6"/>
                </svg>
              </div>
              <div class="tree-content">
                <div class="tree-title">${task.title}</div>
                <div class="tree-meta">${task.assignee || '未指派'}</div>
              </div>
              <div class="progress-bar">
                <div class="progress-fill" style="width:${task.status === 'done' ? '100' : task.status === 'doing' ? '50' : '0'}%"></div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderGantt(tasks) {
      const days = [];
      const today = new Date();
      for (let i = 0; i < 14; i++) {
        const d = new Date(today);
        d.setDate(d.getDate() + i);
        days.push(d);
      }

      return `
        <div class="detail-header">
          <span class="detail-title">甘特图</span>
        </div>
        <div class="gantt-container">
          <div class="gantt-labels">
            <div class="gantt-label header">任务名称</div>
            ${tasks.slice(0, 6).map(task => `
              <div class="gantt-label">${task.title}</div>
            `).join('')}
          </div>
          <div class="gantt-timeline">
            <div class="gantt-header">
              ${days.map(d => `
                <div class="gantt-day ${d.getDay() === 0 || d.getDay() === 6 ? 'weekend' : ''}">
                  ${d.getMonth()+1}/${d.getDate()}
                </div>
              `).join('')}
            </div>
            <div class="gantt-rows">
              ${tasks.slice(0, 6).map((task, idx) => {
                const startIdx = Math.max(0, idx);
                const width = 2 + Math.random() * 4;
                return `
                  <div class="gantt-row">
                    <div class="gantt-cell" style="width:${startIdx * 56}px"></div>
                    <div class="gantt-bar ${task.status}" style="width:${width * 56}px;left:${startIdx * 56 + 10}px;" onclick="openTaskDetail('${task.id}')">
                      ${task.title}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // ========== Leader Dashboard ==========
    function renderLeaderDashboard() {
      const content = document.getElementById('leaderContent');
      const tab = data.currentLeaderTab;

      switch(tab) {
        case 'dashboard':
          content.innerHTML = renderDashboard();
          break;
        case 'projects':
          content.innerHTML = renderAllProjects();
          break;
        case 'org':
          content.innerHTML = renderOrgChart();
          break;
        case 'audit':
          content.innerHTML = renderAuditLog();
          break;
        case 'manage':
          content.innerHTML = renderLeaderManagement();
          break;
      }
    }

    function renderDashboard() {
      const allTasks = Object.values(data.projects).flatMap(p => p.tasks);
      const todo = allTasks.filter(t => t.status === 'todo').length;
      const doing = allTasks.filter(t => t.status === 'doing').length;
      const done = allTasks.filter(t => t.status === 'done').length;
      const total = allTasks.length;
      const progress = total > 0 ? Math.round((done / total) * 100) : 0;
      const online = data.allMembers.filter(m => m.online).length;

      return `
        <div class="dashboard-grid">
          <div class="stat-card">
            <div class="stat-card-header">
              <div class="stat-card-icon blue">📁</div>
            </div>
            <div class="stat-card-title">总项目数</div>
            <div class="stat-card-value">${Object.keys(data.projects).length}</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-header">
              <div class="stat-card-icon orange">📋</div>
            </div>
            <div class="stat-card-title">总任务数</div>
            <div class="stat-card-value">${total}</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-header">
              <div class="stat-card-icon green">👥</div>
            </div>
            <div class="stat-card-title">团队成员</div>
            <div class="stat-card-value">${data.allMembers.length}</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-header">
              <div class="stat-card-icon red">⚠️</div>
            </div>
            <div class="stat-card-title">在线节点</div>
            <div class="stat-card-value">${online}/${data.allMembers.length}</div>
          </div>
        </div>

        <div class="dashboard-grid" style="grid-template-columns: 1fr 1fr;">
          <div class="stat-card" style="display:flex;align-items:center;gap:24px;">
            <div class="progress-ring">
              <svg width="80" height="80">
                <circle class="bg" cx="40" cy="40" r="32"/>
                <circle class="fg" cx="40" cy="40" r="32"
                  stroke-dasharray="${2 * Math.PI * 32}"
                  stroke-dashoffset="${2 * Math.PI * 32 * (1 - progress / 100)}"/>
              </svg>
              <div class="value">${progress}%</div>
            </div>
            <div>
              <div class="stat-card-title">整体完成率</div>
              <div style="font-size:24px;font-weight:700;margin-top:4px;">${done} / ${total}</div>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-card-title" style="margin-bottom:16px;">任务状态分布</div>
            <div style="display:flex;gap:16px;">

              <div style="flex:1;text-align:center;">
                <div style="font-size:28px;font-weight:700;color:var(--green);">${done}</div>

                  <div class="audit-time">${log.time}</div>
                </div>

          </div>
        </div>

    function renderAllProjects() {
      return `
        <div class="stat-card-title" style="font-size:18px;margin-bottom:20px;">📁 所有项目列表</div>
        <div class="data-table">
          <table>
            <thead>
              <tr>
                <th>项目名称</th>
                <th>完成率</th>
                <th>待办</th>
                <th>进行中</th>
                <th>已完成</th>
                <th>管理员</th>
                <th>成员</th>
              </tr>
            </thead>
            <tbody>
              ${Object.values(data.projects).map(p => {
                const todo = p.tasks.filter(t => t.status === 'todo').length;
                const doing = p.tasks.filter(t => t.status === 'doing').length;
                const done = p.tasks.filter(t => t.status === 'done').length;
                const total = p.tasks.length;
                const progress = total > 0 ? Math.round((done / total) * 100) : 0;
                const admin = p.members.find(m => m.role === 'admin' || m.role === 'super_leader');
                return `
                  <tr onclick="switchToProject(${p.id})" style="cursor:pointer;">
                    <td><strong>${p.name}</strong></td>
                    <td>
                      <div style="display:flex;align-items:center;gap:8px;">
                        <div style="flex:1;height:6px;background:var(--gray-light);border-radius:3px;overflow:hidden;">
                          <div style="width:${progress}%;height:100%;background:var(--blue);border-radius:3px;"></div>
                        </div>
                        <span style="font-size:12px;color:var(--text-secondary);">${progress}%</span>
                      </div>
                    </td>
                    <td>${todo}</td>
                    <td style="color:var(--orange);">${doing}</td>
                    <td style="color:var(--green);">${done}</td>
                    <td>${admin ? admin.name : '-'}</td>
                    <td>${p.members.length}人</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderOrgChart() {
      const superLeaders = data.allMembers.filter(m => m.role === 'super_leader');
      const leaders = data.allMembers.filter(m => m.role === 'leader');
      const admins = data.allMembers.filter(m => m.role === 'admin');
      const members = data.allMembers.filter(m => m.role === 'member');

      return `
        <div class="stat-card-title" style="font-size:18px;margin-bottom:20px;">👥 组织架构（实时）</div>
        <div class="org-chart">
          <div class="org-level">
            ${superLeaders.map(m => `
              <div class="org-node super">
                <div class="org-avatar">${m.name[0]}</div>
                <div class="org-name">${m.name}</div>
                <div class="org-role">👑 超级领导</div>
              </div>
            `).join('')}
          </div>
          <div style="display:flex;justify-content:center;color:var(--text-secondary);">↓</div>
          <div class="org-level">
            ${leaders.map(m => `
              <div class="org-node">
                <div class="org-avatar">${m.name[0]}</div>
                <div class="org-name">${m.name}</div>
                <div class="org-role">👔 普通领导</div>
              </div>
            `).join('')}
          </div>
          <div style="display:flex;justify-content:center;color:var(--text-secondary);">↓</div>
          <div class="org-level">
            ${admins.map(m => `
              <div class="org-node">
                <div class="org-avatar" style="background:var(--blue-light);color:var(--blue);">${m.name[0]}</div>
                <div class="org-name">${m.name}</div>
                <div class="org-role">📋 项目管理员</div>
              </div>
            `).join('')}
          </div>
          <div style="display:flex;justify-content:center;color:var(--text-secondary);">↓</div>
          <div class="org-level">
            ${members.map(m => `
              <div class="org-node">
                <div class="org-avatar" style="background:${m.online ? 'var(--green-light)' : 'var(--gray-light)'};color:${m.online ? 'var(--green)' : 'var(--gray)'};">
                  ${m.name[0]}
                </div>
                <div class="org-name">${m.name}</div>
                <div class="org-role">${m.department}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderAuditLog() {
      return `
        <div class="stat-card-title" style="font-size:18px;margin-bottom:20px;">📋 角色变更审计记录</div>
        <div class="audit-log">
          ${data.auditLogs.map(log => `
            <div class="audit-item">
              <div class="audit-icon" style="font-size:16px;">${log.icon}</div>
              <div class="audit-content">
                <div class="audit-text">
                  <strong>${log.actor}</strong> ${log.action}
                  ${log.target ? `<strong>${log.target}</strong>` : ''}
                  ${log.from ? `从"${log.from}"` : ''}
                  ${log.to ? `变更为"${log.to}"` : ''}
                </div>
                <div class="audit-time">${log.time}</div>
              </div>
            </div>
          `).join('')}
        </div>
        <div style="margin-top:20px;padding:16px;background:var(--blue-light);border-radius:12px;font-size:13px;color:var(--blue);">
          💡 所有角色变更记录永久保存在聊天中，透明公开，可追溯
        </div>
      `;
    }

    function renderLeaderManagement() {
      if (data.currentUser.role !== 'super_leader') {
        return `
          <div style="text-align:center;padding:60px;">
            <div style="font-size:48px;margin-bottom:16px;">🔒</div>
            <div style="font-size:18px;font-weight:600;">权限不足</div>
            <div style="color:var(--text-secondary);margin-top:8px;">仅超级领导可管理领导团队</div>
          </div>
        `;
      }

      return `
        <div class="stat-card-title" style="font-size:18px;margin-bottom:20px;">👔 领导管理</div>
        <div class="stat-card" style="margin-bottom:20px;">
          <div class="stat-card-title" style="margin-bottom:16px;">当前领导列表</div>
          <div class="data-table" style="box-shadow:none;">
            <table>
              <thead>
                <tr>
                  <th>姓名</th>
                  <th>账号ID</th>
                  <th>角色</th>
                  <th>部门</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody>
                ${data.allMembers.filter(m => m.role === 'super_leader' || m.role === 'leader').map(m => `
                  <tr>
                    <td><strong>${m.name}</strong></td>
                    <td>user_${m.id}</td>
                    <td><span class="role-badge ${m.role === 'super_leader' ? 'role-super' : 'role-leader'}">${m.role === 'super_leader' ? '👑 超级领导' : '👔 普通领导'}</span></td>
                    <td>${m.department}</td>
                    <td>${m.role === 'super_leader' ? '-' : `<button class="btn btn-secondary" style="padding:6px 12px;font-size:12px;" onclick="removeLeader('${m.name}')">移除</button>`}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-title" style="margin-bottom:16px;">添加领导</div>
          <div style="display:flex;gap:12px;">
            <input type="text" class="form-input" id="leaderUserId" placeholder="输入用户ID或姓名" style="flex:1;">
            <button class="btn btn-primary" onclick="addLeader()">确认任命</button>
          </div>
          <div style="font-size:13px;color:var(--text-secondary);margin-top:12px;line-height:1.6;">
            💡 任命后将执行以下操作：<br>
            1. 生成角色变更指令（带签名）<br>
            2. 广播给局域网所有客户端<br>
            3. 目标客户端自动更新配置<br>
            4. 聊天记录中生成审计日志
          </div>
        </div>
      `;
    }

    // ========== Task Actions ==========
    function toggleTaskStatus(taskId) {
      const project = data.projects[data.currentProject];
      const task = project.tasks.find(t => t.id === taskId);
      if (task) {
        const newStatus = task.status === 'done' ? 'todo' : 'done';
        updateTaskStatus(taskId, newStatus);
      }
    }

    function updateTaskStatus(taskId, newStatus) {
      const project = data.projects[data.currentProject];
      const task = project.tasks.find(t => t.id === taskId);
      if (task) {
        const oldStatus = task.status;
        task.status = newStatus;

        const statusLabels = { todo: '待办', doing: '进行中', done: '已完成' };
        const now = new Date();
        const time = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;

        project.messages.push({
          id: Date.now(),
          type: 'system',
          content: '系统',
          text: `👔 ${data.currentUser.name} 将任务「${task.title}」状态改为${statusLabels[newStatus]}`,
          time: time
        });

        renderChat();
        renderKanban();
        updateStats();

        if (data.currentView !== 'kanban') {
          switchView(data.currentView);
        }
      }
    }

    function sendMessage() {
      const input = document.getElementById('chatInput');
      const content = input.value.trim();
      if (!content) return;

      const project = data.projects[data.currentProject];
      const now = new Date();
      const time = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;

      const createMatch = content.match(/@create\s+(.+)/i);
      if (createMatch) {
        const taskTitle = createMatch[1].trim();
        const newTaskId = `task_${Date.now()}`;

        project.tasks.push({
          id: newTaskId,
          title: taskTitle,
          status: 'todo',
          assignee: '',
          priority: 'medium',
          startDate: '',
          dueDate: ''
        });

        project.messages.push({
          id: Date.now(),
          type: 'task_card',
          sender: data.currentUser.name,
          taskId: newTaskId,
          time: time,
          avatar: data.currentUser.name[0]
        });

        project.messages.push({
          id: Date.now() + 1,
          type: 'system',
          content: '系统',
          text: `📋 ${data.currentUser.name} 创建了任务「${taskTitle}」`,
          time: time
        });
      } else {
        project.messages.push({
          id: Date.now(),
          type: 'text',
          sender: data.currentUser.name,
          content: content,
          time: time,
          avatar: data.currentUser.name[0]
        });
      }

      input.value = '';
      renderChat();
      renderKanban();
      updateStats();
    }

    function setupInputHandlers() {
      const input = document.getElementById('chatInput');
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      input.addEventListener('input', () => {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 120) + 'px';
      });
    }

    // ========== Modals ==========
    function openTaskDetail(taskId) {
      data.currentTaskId = taskId;
      const project = data.projects[data.currentProject];
      const task = project.tasks.find(t => t.id === taskId);

      if (task) {
        document.getElementById('taskModalTitle') || (document.querySelector('#taskModal .modal-title').textContent = '任务详情');
        document.getElementById('taskTitle').value = task.title;
        document.getElementById('taskDesc').value = task.description || '';
        document.getElementById('taskStatus').value = task.status;
        document.getElementById('taskPriority').value = task.priority;
        document.getElementById('taskAssignee').value = task.assignee || '';
        document.getElementById('taskStartDate').value = task.startDate || '';
        document.getElementById('taskDueDate').value = task.dueDate || '';
        document.getElementById('taskModal').classList.add('show');
      }
    }

    function closeTaskModal() {
      document.getElementById('taskModal').classList.remove('show');
    }

    function saveTask() {
      const project = data.projects[data.currentProject];
      const task = project.tasks.find(t => t.id === data.currentTaskId);

      if (task) {
        const oldStatus = task.status;
        task.title = document.getElementById('taskTitle').value;
        task.description = document.getElementById('taskDesc').value;
        const newStatus = document.getElementById('taskStatus').value;
        task.priority = document.getElementById('taskPriority').value;
        task.assignee = document.getElementById('taskAssignee').value;
        task.startDate = document.getElementById('taskStartDate').value;
        task.dueDate = document.getElementById('taskDueDate').value;

        if (oldStatus !== newStatus) {
          const now = new Date();
          const time = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
          const statusLabels = { todo: '待办', doing: '进行中', done: '已完成' };
          project.messages.push({
            id: Date.now(),
            type: 'system',
            content: '系统',
            text: `👔 ${data.currentUser.name} 将任务「${task.title}」状态改为${statusLabels[newStatus]}`,
            time: time
          });
        }

        task.status = newStatus;

        closeTaskModal();
        renderChat();
        renderKanban();
        updateStats();

        if (data.currentView !== 'kanban') {
          switchView(data.currentView);
        }
      }
    }

    function deleteTask() {
      const project = data.projects[data.currentProject];
      const idx = project.tasks.findIndex(t => t.id === data.currentTaskId);

      if (idx > -1) {
        project.tasks.splice(idx, 1);
        closeTaskModal();
        renderChat();
        renderKanban();
        updateStats();
      }
    }

    function showCreateTaskModal() {
      document.getElementById('newTaskTitle').value = '';
      document.getElementById('createTaskModal').classList.add('show');
    }

    function closeCreateTaskModal() {
      document.getElementById('createTaskModal').classList.remove('show');
    }

    function createTask() {
      const title = document.getElementById('newTaskTitle').value.trim();
      const assignee = document.getElementById('newTaskAssignee').value;

      if (!title) return;

      const project = data.projects[data.currentProject];
      const now = new Date();
      const time = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
      const newTaskId = `task_${Date.now()}`;

      project.tasks.push({
        id: newTaskId,
        title: title,
        status: 'todo',
        assignee: assignee,
        priority: 'medium',
        startDate: '',
        dueDate: ''
      });

      project.messages.push({
        id: Date.now(),
        type: 'task_card',
        sender: data.currentUser.name,
        taskId: newTaskId,
        time: time,
        avatar: data.currentUser.name[0]
      });

      project.messages.push({
        id: Date.now() + 1,
        type: 'system',
        content: '系统',
        text: `📋 ${data.currentUser.name} 创建了任务「${title}」`,
        time: time
      });

      closeCreateTaskModal();
      renderChat();
      renderKanban();
      updateStats();
    }

    // ========== Leader Actions ==========
    function addLeader() {
      const input = document.getElementById('leaderUserId');
      const userId = input.value.trim();

      if (!userId) return;

      const now = new Date();
      const time = now.toLocaleString('zh-CN');

      data.auditLogs.unshift({
        id: Date.now(),
        time: time,
        actor: data.currentUser.name,
        action: '任命',
        target: userId,
        from: '普通成员',
        to: '普通领导',
        icon: '👑'
      });

      input.value = '';
      alert(`已任命 ${userId} 为普通领导！\n\n💡 角色变更指令已广播至局域网所有客户端`);
      renderLeaderDashboard();
    }

    function removeLeader(name) {
      if (confirm(`确定要移除 ${name} 的领导身份吗？`)) {
        alert(`已移除 ${name} 的领导身份`);
        renderLeaderDashboard();
      }
    }

    function exportReport() {
      alert('报表导出功能\n\n支持格式：PNG / PDF / Excel\n\n请选择导出内容：\n• 个人工作报表\n• 项目报表\n• 全局报表（领导专属）');
    }

    // ========== Other Actions ==========
    function showProfile() {
      alert(`当前用户信息\n\n姓名：${data.currentUser.name}\n角色：${data.currentUser.role === 'super_leader' ? '超级领导' : data.currentUser.role === 'leader' ? '普通领导' : data.currentUser.role === 'admin' ? '项目管理员' : '普通成员'}\n部门：${data.currentUser.department}\n职位：${data.currentUser.title}`);
    }

    function shareProject() {
      const project = data.projects[data.currentProject];
      alert(`分享项目「${project.name}」\n\n局域网邀请链接已复制到剪贴板`);
    }

    function showProjectSettings() {
      alert('项目设置功能即将上线');
    }

    function attachImage() {
      alert('图片上传功能即将上线');
    }

    function switchToProject(id) {
      data.currentProject = id;
      renderMembers();
      renderChat();
      renderKanban();
      updateStats();
      switchMainView('project');
    }

    // Initialize
    init();
  </script>
