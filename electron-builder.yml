appId: com.lanpm.app
productName: LanPM
directories:
  buildResources: resources
  output: dist
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/node-screenshots/**'
files:
  - '!**/.vscode/*'
  - '!docs/**'
  - '!.cursor/**'
  - '!.cursorGrowth/**'
  - '!.lanpm/**'
  - '!dist/**'
  - '!dist-pack/**'
  - '!dist-pack2/**'
  - '!coverage/**'
  - '!tests/**'
  - '!src/**'
  - '!scripts/**'
  - '!**/*.md'
  - '!**/*.tsbuildinfo'
  - '!tsconfig*.json'
  - '!vitest.config.ts'
  - '!eslint.config.js'
  - '!electron.vite.config.ts'
  - '!onekey_run.*'
  # Renderer UI 已由 Vite 打进 out/；勿再整包塞进 asar（保留 react* 供 electron-screenshots）
  - '!node_modules/antd/**'
  - '!node_modules/@ant-design/**'
  - '!node_modules/@excalidraw/**'
  - '!node_modules/@fullcalendar/**'
  - '!node_modules/@mizuka-wu/**'
  - '!node_modules/@dnd-kit/**'
  - '!node_modules/gantt-task-react/**'
  - '!node_modules/highlight.js/**'
  - '!node_modules/html2canvas/**'
  - '!node_modules/jspdf/**'
  - '!node_modules/pinyin-pro/**'
  - '!node_modules/zustand/**'
  - '!node_modules/react-router-dom/**'
  - '!node_modules/react-router/**'
  - '!node_modules/@remix-run/**'
  - '!node_modules/mermaid/**'
  - '!node_modules/katex/**'
  - '!node_modules/elkjs/**'
  - '!node_modules/cytoscape/**'
  - '!node_modules/cytoscape-*/**'
  - '!node_modules/sass/**'
  - '!node_modules/roughjs/**'
  - '!node_modules/canvg/**'
  - '!node_modules/core-js/**'
  - '!node_modules/dompurify/**'
# Explicit multi-arch (TASK-265) — do not rely on host default alone
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  category: Office
extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: plugins
    to: plugins
    filter:
      - '**/*'
      - '!**/node_modules/**'
