appId: com.lanpm.app
productName: LanPM
directories:
  buildResources: resources
  output: dist
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
files:
  - '!**/.vscode/*'
  - '!docs/**'
  - '!archive/**'
  - '!**/*.md'
win:
  target:
    - nsis
mac:
  target:
    - dmg
linux:
  target:
    - AppImage
