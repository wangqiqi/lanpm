appId: com.lanpm.app
productName: LanPM
directories:
  buildResources: resources
  output: dist
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/node-screenshots/**'
files:
  - '!**/.vscode/*'
  - '!docs/**'
  - '!.cursorGrowth/**'
  - '!**/*.md'
win:
  target:
    - nsis
mac:
  target:
    - dmg
linux:
  target:
    - AppImage
    - deb
  category: Office
extraResources:
  - from: resources/icon.png
    to: icon.png
