appId: com.lanpm.app
productName: LanPM
directories:
  buildResources: resources
  output: dist
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/node-screenshots/**'
files:
  - '!**/.vscode/*'
  - '!docs/**'
  - '!.cursorGrowth/**'
  - '!**/*.md'
# Explicit multi-arch (TASK-265) — do not rely on host default alone
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  category: Office
extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: plugins
    to: plugins
    filter:
      - '**/*'
      - '!**/node_modules/**'
