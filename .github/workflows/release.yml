# LanPM — 三平台安装包（Electron Builder）
#
# 触发：push 标签 v*（仅 B 档「发布二进制」，见 .cursor/skills/lanpm-release）
# 产物：Windows NSIS · macOS DMG · Linux AppImage（electron-builder.yml）
#
# Immutable Releases：先 draft 上传资产，再 publish（见 publish job）
# 权限：GITHUB_TOKEN 写 Release；无需 Apple 签名即可产出未签名包（本地/内网分发）

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build/publish (e.g. v1.0.0-rc.77)'
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  resolve-tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.out.outputs.tag }}
      is_prerelease: ${{ steps.out.outputs.is_prerelease }}
    steps:
      - id: out
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          TAG="${TAG#v}"
          TAG="v${TAG#v}"
          IS_PRERELEASE=false
          case "$TAG" in
            *-rc.*|*-beta*|*-alpha*) IS_PRERELEASE=true ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.label }})
    needs: resolve-tag
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x86_64
            platform: windows-latest
            artifact: windows
          - label: macOS Apple Silicon
            platform: macos-latest
            artifact: macos
          - label: Linux x86_64
            platform: ubuntu-22.04
            artifact: linux

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3 \
            libgtk-3-0 \
            libnotify4 \
            libnss3 \
            libxss1 \
            libxtst6 \
            xdg-utils \
            libatspi2.0-0 \
            libgbm1 \
            libasound2 \
            libfuse2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package installer
        env:
          # 无开发者证书时仍可产出未签名安装包
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never

      - name: List dist output
        shell: bash
        run: |
          echo "=== dist/ ==="
          ls -lah dist/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.blockmap
            dist/*.yml
            dist/*.yaml
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build, resolve-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release files
        run: |
          echo "=== release-assets ==="
          find release-assets -type f | sort
          ls -lah release-assets/

      # Immutable Releases：prerelease 若先 publish 再上传会失败，必须先 draft
      - name: Upload release assets (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          name: LanPM ${{ needs.resolve-tag.outputs.tag }}
          draft: true
          prerelease: ${{ needs.resolve-tag.outputs.is_prerelease == 'true' }}
          generate_release_notes: false
          body: |
            ## LanPM ${{ needs.resolve-tag.outputs.tag }}

            分布式局域网协作客户端 — Windows / macOS / Linux 安装包。

            详见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)。

            | 平台 | 文件 |
            |------|------|
            | Windows | `*.exe`（NSIS） |
            | macOS | `*.dmg` |
            | Linux | `*.AppImage` |
          files: release-assets/**/*
          fail_on_unmatched_files: false

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          IS_PRERELEASE: ${{ needs.resolve-tag.outputs.is_prerelease }}
        run: |
          if [ "$IS_PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest
          fi
