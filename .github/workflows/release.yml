# LanPM — 三平台安装包（Electron Builder）
#
# B 档推荐：Actions → Run workflow · tag=v* · ref=master（勿先 push tag）
# 流程：构建 → draft 上传 → REST API 自动 Publish → 补打 git tag（若缺失）
#
# 勿 Re-run failed jobs（会沿用旧 YAML）；失败请 Run workflow 重跑。

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0-rc.80)'
        required: true
        type: string
      ref:
        description: 'Git ref to build (default master — 含最新 CI 脚本与 deb)'
        required: false
        default: master
      publish_only:
        description: 'Skip build — only publish existing draft (recovery)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.event.inputs.tag) || github.ref }}
  cancel-in-progress: true

jobs:
  resolve-tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.out.outputs.tag }}
      is_prerelease: ${{ steps.out.outputs.is_prerelease }}
      build_ref: ${{ steps.meta.outputs.build_ref }}
      commit_sha: ${{ steps.out.outputs.commit_sha }}
    steps:
      - id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BR="${{ github.event.inputs.ref }}"
            [ -z "$BR" ] && BR=master
            RAW="${{ github.event.inputs.tag }}"
          else
            BR="${{ github.ref_name }}"
            RAW="${{ github.ref_name }}"
          fi
          echo "build_ref=$BR" >> "$GITHUB_OUTPUT"
          echo "raw_tag=$RAW" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.build_ref }}
          fetch-depth: 0

      - id: out
        run: |
          TAG=$(bash .github/scripts/normalize-tag.sh "${{ steps.meta.outputs.raw_tag }}")
          IS_PRERELEASE=false
          case "$TAG" in
            *-rc.*|*-beta*|*-alpha*) IS_PRERELEASE=true ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG build_ref=${{ steps.meta.outputs.build_ref }} sha=$(git rev-parse HEAD)"

  build:
    name: Build (${{ matrix.label }})
    needs: resolve-tag
    if: github.event_name != 'workflow_dispatch' || inputs.publish_only != true
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x86_64
            platform: windows-latest
            artifact: windows-x64
            builder_args: --win --x64
          - label: macOS Intel x64
            platform: macos-13
            artifact: macos-x64
            builder_args: --mac --x64
          - label: macOS Apple Silicon
            platform: macos-latest
            artifact: macos-arm64
            builder_args: --mac --arm64
          - label: Linux x86_64
            platform: ubuntu-22.04
            artifact: linux-x64
            builder_args: --linux --x64
          - label: Linux arm64
            platform: ubuntu-24.04-arm
            artifact: linux-arm64
            builder_args: --linux --arm64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.build_ref }}

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: bash .github/scripts/install-linux-deps.sh release

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.builder_args }} --publish never

      - name: List dist output
        shell: bash
        run: ls -lah .lanpm/artifact/dist/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.artifact }}
          path: |
            .lanpm/artifact/dist/*.exe
            .lanpm/artifact/dist/*.dmg
            .lanpm/artifact/dist/*.AppImage
            .lanpm/artifact/dist/*.deb
            .lanpm/artifact/dist/*.blockmap
            .lanpm/artifact/dist/latest*.yml
            .lanpm/artifact/dist/latest-*.yml
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build, resolve-tag]
    if: >-
      needs.resolve-tag.result == 'success' &&
      needs.build.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.publish_only != true)
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release files
        run: |
          find release-assets -type f | sort
          ls -lah release-assets/

      - name: Upload release assets (draft)
        id: draft_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          target_commitish: ${{ needs.resolve-tag.outputs.commit_sha }}
          name: LanPM ${{ needs.resolve-tag.outputs.tag }}
          draft: true
          prerelease: ${{ needs.resolve-tag.outputs.is_prerelease == 'true' }}
          generate_release_notes: false
          body: |
            ## LanPM ${{ needs.resolve-tag.outputs.tag }}

            分布式局域网协作客户端 — Windows / macOS / Linux 安装包。

            详见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)。

            | 平台 | 文件 |
            |------|------|
            | Windows x64 | `*.exe`（NSIS） |
            | macOS x64 / arm64 | `*.dmg` |
            | Linux x64 / arm64 | `*.AppImage` · `*.deb` |

            矩阵说明见 [docs/05 §1.4](https://github.com/${{ github.repository }}/blob/master/docs/05_测试与联调发布.md#14-跨平台发版矩阵)。
            Win arm64 不在本 CI 强制构建（自建机，见文档 §1.4）。
          files: |
            release-assets/**/*.exe
            release-assets/**/*.dmg
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            release-assets/**/*.blockmap
            release-assets/latest*.yml
            release-assets/latest-*.yml
          fail_on_unmatched_files: false

      - uses: actions/checkout@v4
        with:
          ref: master
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: true

      - name: Publish release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          bash .github/scripts/publish-github-release.sh
          "${{ needs.resolve-tag.outputs.tag }}"
          "${{ needs.resolve-tag.outputs.is_prerelease }}"
          "${{ steps.draft_release.outputs.id }}"

      - name: Ensure git tag on commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ensure-release-tag.sh "${{ needs.resolve-tag.outputs.tag }}" "${{ needs.resolve-tag.outputs.commit_sha }}"

  publish-only:
    name: Publish draft release (no rebuild)
    needs: resolve-tag
    if: github.event_name == 'workflow_dispatch' && inputs.publish_only == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish-github-release.sh "${{ needs.resolve-tag.outputs.tag }}" "${{ needs.resolve-tag.outputs.is_prerelease }}"

      - name: Ensure git tag on commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/ensure-release-tag.sh "${{ needs.resolve-tag.outputs.tag }}" "${{ needs.resolve-tag.outputs.commit_sha }}"
