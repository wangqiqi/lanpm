# LanPM — 三平台安装包（Electron Builder）
#
# 触发：push 标签 v* · workflow_dispatch
# Immutable Releases：draft 上传 → REST API publish（见 .github/scripts/publish-github-release.sh）
#
# 重跑指南（勿 Re-run failed jobs，会沿用旧 YAML）：
#   1. verify：Actions → verify → Run workflow
#   2. release 全量：Run workflow · tag=v* · publish_only=false
#   3. 仅发布 draft：Run workflow · tag=v* · publish_only=true
#   4. R2：Release 成功后自动触发；或 Sync Release to R2 手动指定 tag

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0-rc.78)'
        required: true
        type: string
      publish_only:
        description: 'Skip build — only publish existing draft release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.event.inputs.tag) || github.ref }}
  cancel-in-progress: true

jobs:
  resolve-tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.out.outputs.tag }}
      is_prerelease: ${{ steps.out.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: true

      - id: out
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.tag }}"
          else
            RAW="${{ github.ref_name }}"
          fi
          TAG=$(bash .github/scripts/normalize-tag.sh "$RAW")
          IS_PRERELEASE=false
          case "$TAG" in
            *-rc.*|*-beta*|*-alpha*) IS_PRERELEASE=true ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.label }})
    needs: resolve-tag
    if: github.event_name != 'workflow_dispatch' || inputs.publish_only != true
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x86_64
            platform: windows-latest
            artifact: windows
          - label: macOS Apple Silicon
            platform: macos-latest
            artifact: macos
          - label: Linux x86_64
            platform: ubuntu-22.04
            artifact: linux

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: bash .github/scripts/install-linux-deps.sh release

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never

      - name: List dist output
        shell: bash
        run: ls -lah dist/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml
            dist/latest-*.yml
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build, resolve-tag]
    if: >-
      needs.resolve-tag.result == 'success' &&
      needs.build.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.publish_only != true)
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release files
        run: |
          find release-assets -type f | sort
          ls -lah release-assets/

      - name: Upload release assets (draft)
        id: draft_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          name: LanPM ${{ needs.resolve-tag.outputs.tag }}
          draft: true
          prerelease: ${{ needs.resolve-tag.outputs.is_prerelease == 'true' }}
          generate_release_notes: false
          body: |
            ## LanPM ${{ needs.resolve-tag.outputs.tag }}

            分布式局域网协作客户端 — Windows / macOS / Linux 安装包。

            详见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)。

            | 平台 | 文件 |
            |------|------|
            | Windows | `*.exe`（NSIS） |
            | macOS | `*.dmg` |
            | Linux | `*.AppImage` |
          files: |
            release-assets/**/*.exe
            release-assets/**/*.dmg
            release-assets/**/*.AppImage
            release-assets/**/*.blockmap
            release-assets/latest*.yml
            release-assets/latest-*.yml
          fail_on_unmatched_files: false

      - uses: actions/checkout@v4
        with:
          ref: master
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          bash .github/scripts/publish-github-release.sh
          "${{ needs.resolve-tag.outputs.tag }}"
          "${{ needs.resolve-tag.outputs.is_prerelease }}"
          "${{ steps.draft_release.outputs.id }}"

  publish-only:
    name: Publish draft release (no rebuild)
    needs: resolve-tag
    if: github.event_name == 'workflow_dispatch' && inputs.publish_only == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/publish-github-release.sh "${{ needs.resolve-tag.outputs.tag }}" "${{ needs.resolve-tag.outputs.is_prerelease }}"
