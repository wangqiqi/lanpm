# AUTO-18 — 三平台 CI 矩阵（verify:m7 全量回归）
name: verify

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m7:
    name: verify:m7 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Full regression
        run: npm run verify:m7
        env:
          LANPM_NETWORK: stub

  visual-screenshots:
    name: verify:visual-screenshots (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build and capture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          npm run build
          xvfb-run -a npm run verify:visual-screenshots
        env:
          LANPM_NETWORK: stub
