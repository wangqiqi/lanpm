# 三平台 CI 矩阵（verify:m7 全量回归）
# 注：verify:discover-sim-full（VirtualLan 12 场景）与 verify:e2e-discover / verify:e2e-pairing（Playwright Electron）为发版前本地/手跑路径，默认不在此 workflow 中。
name: verify

on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - 'docs/**'
      - '.cursor/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '.cursor/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m7:
    name: verify:m7 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: bash .github/scripts/install-linux-deps.sh verify

      - name: Install
        run: npm ci

      - name: Full regression
        run: npm run verify:m7
        env:
          LANPM_NETWORK: stub
