# 将 GitHub Release 产物同步到 Cloudflare R2（可选独立下载页）
#
# 触发：Release workflow 成功 · workflow_dispatch 指定 tag
# Secrets：R2_ACCESS_KEY_ID · R2_SECRET_ACCESS_KEY
# Variables：R2_ACCOUNT_ID · R2_BUCKET · BASE_URL

name: Sync Release to R2

on:
  workflow_run:
    workflows: ['Release']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（留空：tag 触发取 head_branch，否则取最新 Release）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    if: >-
      vars.R2_BUCKET != '' &&
      vars.R2_ACCOUNT_ID != '' &&
      vars.BASE_URL != ''

    steps:
      - uses: actions/checkout@v4

      - name: Check upstream Release workflow
        if: github.event_name == 'workflow_run'
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "Release workflow conclusion: ${{ github.event.workflow_run.conclusion }} — skip sync."
            exit 1
          fi

      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(bash .github/scripts/resolve-sync-tag.sh \
            "${{ github.event.inputs.tag }}" \
            "${{ github.event_name }}" \
            "${{ github.event.workflow_run.head_branch || '' }}")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          gh release download "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir release-assets/
          echo "=== Downloaded (tag: ${{ steps.tag.outputs.tag }}) ==="
          ls -lh release-assets/

      - name: Generate index.html
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          BASE_URL: ${{ vars.BASE_URL }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/generate-r2-download-index.py

      - name: Sync to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          ENDPOINT="https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          aws s3 sync release-assets/ "s3://${{ vars.R2_BUCKET }}/" \
            --endpoint-url "$ENDPOINT" \
            --delete \
            --no-progress
          echo "=== Bucket contents ==="
          aws s3 ls "s3://${{ vars.R2_BUCKET }}/" --endpoint-url "$ENDPOINT"
